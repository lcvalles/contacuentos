<!DOCTYPE html>
<html lang="es" data-space="lauris">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Presupuesto</title>
<meta name="description" content="Presupuesto personal en tiempo real.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b8f'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='central' text-anchor='middle' fill='%23fdf6e9' font-family='Georgia,serif' font-size='19' font-weight='700'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --bg:#f6f4ef; --surface:#fffdf9; --surface-2:#f1eee6; --surface-3:#eae5da;
  --ink:#26231d; --ink-2:#645d51; --ink-3:#9a9184;
  --line:#e7e1d4; --line-2:#d9d2c2;
  --accent:#2f6b8f; --accent-ink:#245572; --accent-soft:#e2edf3;
  --ok:#3f7d4f;   --ok-bg:#e6efe4;
  --warn:#a97b18; --warn-bg:#f7ecd1;
  --over:#b0433a; --over-bg:#f6e0dc;
  --tc:#6b4a8f; --td:#356487; --efvo:#4c7a3f;
  --r-sm:9px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --sh-sm:0 1px 2px rgba(38,35,29,.05);
  --sh-md:0 2px 6px rgba(38,35,29,.06), 0 12px 26px -16px rgba(38,35,29,.2);
  --sh-lg:0 8px 40px -8px rgba(38,35,29,.28);
  --f-display:'Fraunces', Georgia, serif;
  --f-body:'DM Sans', system-ui, -apple-system, sans-serif;
  --maxw:720px;
}
html[data-space="yuli"]{ --accent:#b0762e; --accent-ink:#8f5d1e; --accent-soft:#f6e9d6; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--f-body); background:var(--bg); color:var(--ink);
  line-height:1.5; min-height:100dvh; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1000px 500px at 100% -10%, rgba(47,107,143,.06), transparent 60%),
    radial-gradient(800px 440px at -10% 110%, rgba(176,118,46,.05), transparent 55%);
  background-attachment:fixed;
}
html[data-space="yuli"] body{
  background-image:
    radial-gradient(1000px 500px at 100% -10%, rgba(176,118,46,.08), transparent 60%),
    radial-gradient(800px 440px at -10% 110%, rgba(47,107,143,.04), transparent 55%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.serif{font-family:var(--f-display)}
.hidden{display:none!important}
svg{display:block}

/* ═══════════ LOCK / SPACE ═══════════ */
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 22px calc(32px + env(safe-area-inset-bottom));background:var(--bg);animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.brandmark{width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff8ee;display:grid;place-items:center;font-family:var(--f-display);font-size:31px;font-weight:600;box-shadow:var(--sh-md);margin-bottom:20px;animation:rise .45s ease both}
.screen h1{font-family:var(--f-display);font-weight:500;font-size:1.6rem;letter-spacing:-.01em;margin-bottom:6px;text-align:center;animation:rise .45s .05s ease both}
.screen .sub{color:var(--ink-3);font-size:.9rem;margin-bottom:28px;text-align:center;max-width:290px;animation:rise .45s .1s ease both}
.pin-row{display:flex;gap:11px;margin-bottom:8px;animation:rise .45s .15s ease both}
.pin-cell{width:50px;height:60px;border-radius:13px;background:var(--surface);border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;transition:border-color .18s, box-shadow .18s}
.pin-cell.filled{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pin-cell.err{border-color:var(--over);animation:shake .35s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-3px)}}
#pinInput{position:absolute;opacity:0;pointer-events:none}
.pin-hint{font-size:.8rem;color:var(--ink-3);min-height:1.2em;margin-top:10px}
.pin-hint.bad{color:var(--over)}
.remember{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:.85rem;color:var(--ink-2);animation:rise .45s .2s ease both}
.remember input{width:16px;height:16px;accent-color:var(--accent)}
.space-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:330px}
.space-card{display:flex;align-items:center;gap:15px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);transition:transform .16s, box-shadow .16s;animation:rise .45s ease both}
.space-card:nth-child(2){animation-delay:.06s}
.space-card:active{transform:scale(.98)} .space-card:hover{box-shadow:var(--sh-md)}
.space-avatar{width:48px;height:48px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.space-card .sc-name{font-family:var(--f-display);font-size:1.2rem;font-weight:500}
.space-card .sc-desc{font-size:.8rem;color:var(--ink-3)}
.space-card .sc-arrow{margin-left:auto;color:var(--ink-3);font-size:1.25rem}

/* ═══════════ SHELL ═══════════ */
#app{max-width:var(--maxw);margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom));animation:fade .35s ease both}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:11px 2px 9px;background:linear-gradient(var(--bg) 70%, rgba(246,244,239,0))}
.appbar .who{display:flex;align-items:center;gap:9px;cursor:pointer;padding:3px;border-radius:11px}
.appbar .who:hover{background:var(--surface-2)}
.who-dot{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:600;font-size:.9rem;flex-shrink:0}
.who-name{font-family:var(--f-display);font-size:1rem;font-weight:500;line-height:1}
.who-sub{font-size:.68rem;color:var(--ink-3)}
.appbar .spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--ink-3);padding:4px 8px;border-radius:20px;background:var(--surface-2);white-space:nowrap}
.sync .d{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.sync.ok .d{background:var(--ok)} .sync.ok{color:var(--ok)}
.sync.saving .d{background:var(--warn);animation:pulse 1s infinite} .sync.saving{color:var(--warn)}
.sync.err .d{background:var(--over)} .sync.err{color:var(--over)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);transition:transform .14s}
.iconbtn:active{transform:scale(.92)}

.monthnav{display:flex;align-items:center;justify-content:center;gap:4px;margin:0 0 12px}
.monthnav button.arw{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);font-size:1.05rem}
.monthnav button.arw:hover{background:var(--surface-2)}
.monthnav .ml{font-family:var(--f-display);font-size:.98rem;font-weight:500;min-width:150px;text-align:center;padding:5px 8px;border-radius:9px}
.monthnav .ml:hover{background:var(--surface-2)}
.monthnav .today-pill{font-size:.68rem;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);padding:3px 7px;border-radius:20px}

/* ═══════════ HERO ═══════════ */
.hero{border-radius:var(--r-xl);background:linear-gradient(165deg, var(--accent-soft), var(--surface) 60%);border:1px solid var(--line);box-shadow:var(--sh-md);padding:16px 18px 15px;margin-bottom:12px;animation:rise .4s ease both}
.hero-label{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:6px}
.hero-amount{font-family:var(--f-display);font-weight:500;font-size:clamp(2.2rem, 9.5vw, 3.1rem);letter-spacing:-.02em;line-height:1.05;margin:3px 0 2px}
.hero-amount.neg{color:var(--over)}
.hero-track{height:7px;border-radius:20px;background:rgba(38,35,29,.09);overflow:hidden;margin:11px 0 10px}
.hero-fill{height:100%;border-radius:20px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hero-fill.warn{background:var(--warn)} .hero-fill.over{background:var(--over)}
.hero-sub{font-size:.78rem;color:var(--ink-2)}
.rhythm{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:.8rem;display:flex;align-items:center;gap:7px;background:var(--ok-bg);color:var(--ok)}
.rhythm.warn{background:var(--warn-bg);color:var(--warn)}
.rhythm.over{background:var(--over-bg);color:var(--over)}
.rhythm .em{font-weight:600}

/* ═══════════ KPI GRID ═══════════ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:10px 11px;animation:rise .4s .03s ease both}
.kpi .k{font-size:.66rem;color:var(--ink-3);letter-spacing:.02em}
.kpi .v{font-family:var(--f-display);font-size:1.02rem;font-weight:500;margin-top:2px}
.kpi .v.ok{color:var(--ok)} .kpi .v.over{color:var(--over)} .kpi .v.accent{color:var(--accent-ink)}
.kpi.tap{cursor:pointer} .kpi.tap:hover{box-shadow:var(--sh-md)}

/* ═══════════ CARD ═══════════ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:13px 15px;margin-bottom:12px;animation:rise .4s .04s ease both}
.card-h{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h .hint{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3);font-size:.72rem}
.card-h .link-btn{font-size:.74rem}

.fcl-flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:.78rem}
.fcl-flow .st{display:flex;flex-direction:column;line-height:1.25}
.fcl-flow .st .k{font-size:.63rem;color:var(--ink-3)}
.fcl-flow .st .v{font-family:var(--f-display);font-weight:500}
.fcl-flow .op{color:var(--ink-3);font-size:.9rem;padding:0 1px}
.fcl-flow .res .v{color:var(--accent-ink);font-size:.98rem}
.fcl-flow .res .v.neg{color:var(--over)}
.fcl3{display:flex;gap:8px;margin-top:13px}
.fcl3 .col{flex:1;background:var(--surface-2);border-radius:11px;padding:9px 8px 8px;text-align:center;cursor:pointer;transition:background .14s;border:1px solid transparent}
.fcl3 .col:hover{background:var(--surface)}
.fcl3 .col.active{background:var(--surface);border-color:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.fcl3 .col .m{font-size:.63rem;color:var(--ink-3);text-transform:capitalize}
.fcl3 .col .bar{height:32px;display:flex;align-items:flex-end;justify-content:center;margin:5px 0}
.fcl3 .col .bar i{width:58%;max-width:24px;border-radius:5px 5px 2px 2px;background:var(--accent-soft);min-height:3px}
.fcl3 .col.active .bar i{background:var(--accent)}
.fcl3 .col .g{font-size:.64rem;color:var(--ink-2)}
.fcl3 .col .f{font-family:var(--f-display);font-size:.78rem;font-weight:500;color:var(--accent-ink)}
.fcl3 .col .f.neg{color:var(--over)}

/* ═══════════ QUINCENA STRIP ═══════════ */
.qstrip{display:flex;gap:8px;margin-bottom:12px}
.qbox{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:11px 13px;cursor:pointer;transition:box-shadow .14s;animation:rise .4s .05s ease both}
.qbox:hover{box-shadow:var(--sh-md)}
.qbox.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.qbox .qt{font-size:.7rem;font-weight:600;color:var(--ink-3);letter-spacing:.04em;display:flex;justify-content:space-between}
.qbox .qt .st{font-weight:500;color:var(--accent)}
.qbox .qv{font-family:var(--f-display);font-size:1.2rem;font-weight:500;margin-top:3px}
.qbox .qm{font-size:.68rem;color:var(--ink-3);margin-top:1px}

/* ═══════════ VALIDACIÓN ═══════════ */
.valrow{display:flex;align-items:center;gap:8px;font-size:.8rem;padding:4px 0}
.valrow .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;color:#fff;flex-shrink:0}
.valrow .ic.ok{background:var(--ok)} .valrow .ic.warn{background:var(--warn)} .valrow .ic.over{background:var(--over)}
.valrow .lbl{flex:1;color:var(--ink-2)}
.valrow .amt{font-family:var(--f-display);font-weight:500}
.valrow .amt.ok{color:var(--ok)} .valrow .amt.over{color:var(--over)}
.extras-line{margin-top:8px;font-size:.74rem;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.extra-chip{background:var(--surface-2);border-radius:20px;padding:3px 9px;color:var(--ink-2)}

/* ═══════════ CATEGORÍAS ═══════════ */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:16px 0 9px}
.section-h{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0}
.link-btn{font-size:.78rem;color:var(--accent);font-weight:600}
.sortchips{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.chip{font-size:.74rem;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);transition:all .14s;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat-list{display:flex;flex-direction:column;gap:6px;animation:rise .35s ease both}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:10px 12px;cursor:pointer;transition:box-shadow .14s, border-color .14s}
.cat:hover{box-shadow:var(--sh-md)}
.cat.filtered{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cat-top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.cat-emoji{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;font-size:1rem;background:var(--surface-2)}
.cat-name{font-weight:600;font-size:.9rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-pct{font-family:var(--f-display);font-size:.88rem;font-weight:500;color:var(--ink-2)}
.cat-pct.warn{color:var(--warn)} .cat-pct.over{color:var(--over)}
.cat-track{height:6px;border-radius:20px;background:var(--surface-2);overflow:hidden;margin-bottom:5px}
.cat-fill{height:100%;border-radius:20px;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.cat-meta{display:flex;justify-content:space-between;font-size:.73rem;color:var(--ink-3)}
.cat-meta .num{color:var(--ink-2)}
.cat-meta .over-tag{color:var(--over);font-weight:600}
.cat.pr{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:9px 12px}
.cat.pr .prg{display:flex;gap:13px}
.cat.pr .prc{display:flex;flex-direction:column;line-height:1.2}
.cat.pr .prc .k{font-size:.58rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
.cat.pr .prc .n{font-family:var(--f-display);font-size:.8rem;font-weight:500}
.cat.pr .prc .n.ok{color:var(--ok)} .cat.pr .prc .n.over{color:var(--over)}
.cat-empty{text-align:center;padding:30px 18px;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md)}
.cat-empty .big{font-size:1.9rem;margin-bottom:6px}
.pr-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:11px;font-size:.76rem}
.pr-foot .pf{display:flex;flex-direction:column}
.pr-foot .pf .k{font-size:.6rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em}
.pr-foot .pf .v{font-family:var(--f-display);font-weight:500}
.pr-foot .pf .v.ok{color:var(--ok)} .pr-foot .pf .v.over{color:var(--over)}

/* ═══════════ MOVIMIENTOS ═══════════ */
#movimientos{scroll-margin-top:64px}
.filterbar{display:flex;gap:5px;margin-bottom:9px;flex-wrap:wrap;align-items:center}
.filter-active{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;background:var(--accent);color:#fff;padding:4px 7px 4px 10px;border-radius:20px}
.filter-active button{color:#fff;font-size:.85rem;line-height:1;opacity:.85}
.day-group{margin-bottom:12px}
.day-head{font-size:.72rem;font-weight:600;color:var(--ink-3);margin:0 2px 6px;display:flex;justify-content:space-between}
.day-head .day-total{font-family:var(--f-display);color:var(--ink-2)}
.mov{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;box-shadow:var(--sh-sm);margin-bottom:5px;cursor:pointer;transition:box-shadow .14s}
.mov:hover{box-shadow:var(--sh-md)}
.mov-emoji{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:.98rem;flex-shrink:0}
.mov-body{flex:1;min-width:0}
.mov-title{font-weight:600;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-sub{font-size:.72rem;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.medio-chip{font-size:.64rem;font-weight:600;padding:2px 5px;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}
.medio-chip.tc{background:#efe6f7;color:var(--tc)}
.medio-chip.td{background:#e3eef6;color:var(--td)}
.medio-chip.efvo{background:#e9efe4;color:var(--efvo)}
.mov-amount{font-family:var(--f-display);font-size:.94rem;font-weight:500;white-space:nowrap}
.mov-empty{text-align:center;padding:26px 18px;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-md)}

/* ═══════════ QUINCENA TAB ═══════════ */
.qseg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:12px}
.qseg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:.85rem;color:var(--ink-2);transition:all .15s}
.qseg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}
.qseg button .sub{display:block;font-size:.64rem;font-weight:500;color:var(--ink-3)}
.medio-split{display:flex;gap:8px}
.ms{flex:1;background:var(--surface-2);border-radius:11px;padding:10px;text-align:center}
.ms .k{font-size:.64rem;font-weight:600;letter-spacing:.03em}
.ms.tc .k{color:var(--tc)} .ms.td .k{color:var(--td)} .ms.efvo .k{color:var(--efvo)}
.ms .v{font-family:var(--f-display);font-size:1rem;font-weight:500;margin-top:3px}
.ms .bar{height:4px;border-radius:20px;margin-top:6px;background:rgba(38,35,29,.08);overflow:hidden}
.ms .bar i{display:block;height:100%;border-radius:20px}

<script>
/* ═══════════════════════════════════════════════════════════════
   PRESUPUESTO · app personal en tiempo real  ·  espacios: lauris / yuli
   Modelo del Excel "Presupuesto 2026":
     FCL = saldo inicial + ingresos − gastos ejecutados  (encadenado mes a mes)
   Módulos: Mes · Quincena/Corte · Año (gráficas + meta de ahorro)
   ═══════════════════════════════════════════════════════════════ */

const ACCESS_PIN = '2026';   // ← cámbiala aquí

const FIREBASE_CONFIG = {
  apiKey:"AIzaSyBEYC-Pjj5wFMLZM_hNB9lxXtsyFv2xJfU",
  authDomain:"yc-productividad.firebaseapp.com",
  projectId:"yc-productividad",
  storageBucket:"yc-productividad.firebasestorage.app",
  messagingSenderId:"304452642538",
  appId:"1:304452642538:web:510d117b87f477147d9993"
};
let db=null, USE_FB=false;
try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); USE_FB=true; }
catch(e){ console.warn('Firebase off:',e); }

const SPACES = {
  lauris:{ name:'Lauris', letter:'L', color:'#2f6b8f' },
  yuli:  { name:'Yuli',   letter:'Y', color:'#b0762e' },
};
const PALETTE = ['#c2703d','#3f7d8f','#7d6a3f','#9c5c6e','#5c7d5c','#6e5c9c','#b0873d',
                 '#4d7d9c','#9c6e4d','#5c8f7d','#8f5c5c','#7d7d3f','#6b5c8f','#3f8f6b'];
const EMOJIS = ['🛒','🍽️','🥑','🍰','☕','🍺','⛽','🚗','🚌','✈️','🅿️','🏠','🏡','🛠️','💡','💧','🔥',
  '🏋️','🧘','💊','🩺','💅','💇','🧴','👕','👟','👗','🎁','🎉','🎈','🎬','🎵','📱','💻','📚','🎓',
  '👧','👦','🐕','🐈','🐷','💜','❤️','💵','💳','🏦','🧾','📦','🌱','✂️','🎾'];
const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ── Semilla de Lauris (Excel Presupuesto 2026) ───────────────── */
const L_CATS = [
  ['mercado','Mercado','🛒',500000],       ['casa_envigado','Casa Envigado','🏠',550000],
  ['casa_girardota','Casa Girardota','🏡',425000], ['gasolina','Gasolina','⛽',350000],
  ['gym','Gym','🏋️',300000],                ['parqueadero','Parqueadero','🅿️',100000],
  ['hijas','Hijas','👧',150000],            ['natillera','Natillera','🐷',210000],
  ['bolsillo_amor','Bolsillo Amor','💜',700000], ['otros','Otros','📦',500000],
  ['celmi','CELMI','🐕',100000],            ['aplicaciones','Aplicaciones','📱',73000],
  ['sura_mama','Plan Sura Mamá','🩺',115000], ['sura_personal','Plan Sura Personal','🩺',150000],
];
const L_OTROS = {'2026-01':500000,'2026-02':2800000,'2026-03':800000,'2026-04':1200000,'2026-05':1500000,
  '2026-06':500000,'2026-07':1500000,'2026-08':4500000,'2026-09':1000000,'2026-10':4500000,'2026-11':500000,'2026-12':4500000};
const L_EXTRAS = {'2026-02':[{id:'x1',nombre:'La Pony',monto:1000000}],'2026-07':[{id:'x2',nombre:'La Gordita',monto:900000}]};
const L_INGRESOS = { nomina:6440000, prima:{'2026-06':3220000,'2026-12':3220000}, extra:{} };
const L_PRIMER_MES = '2026-01';
const L_PRIMER_VIVO = '2026-08';
const L_META_AHORRO = 13500000;   // FCL objetivo a diciembre (del Excel)

function seedLauris(){
  const cats = L_CATS.map((c,i)=>({ id:c[0], nombre:c[1], emoji:c[2], color:PALETTE[i%PALETTE.length] }));
  const plan = {};
  L_CATS.forEach(c=>{
    plan[c[0]] = {};
    for(let m=1;m<=12;m++){
      const mk='2026-'+String(m).padStart(2,'0');
      if(c[0]==='otros') plan[c[0]][mk]=L_OTROS[mk];
      else if(c[0]==='sura_personal' && m===1) continue;
      else plan[c[0]][mk]=c[3];
    }
  });
  return {
    categorias:cats, plan,
    extras:JSON.parse(JSON.stringify(L_EXTRAS)),
    ingresos:JSON.parse(JSON.stringify(L_INGRESOS)),
    saldoInicial:0, primerMes:L_PRIMER_MES, primerMesVivo:L_PRIMER_VIVO,
    metaAhorro:{ anio:2026, monto:L_META_AHORRO },
    cortes:{}, gastos:[], reglas:[],
  };
}
function seedYuli(){
  const hoy=bogotaToday().slice(0,7);
  return { categorias:[], plan:{}, extras:{}, ingresos:{nomina:0,prima:{},extra:{}},
    saldoInicial:0, primerMes:hoy, primerMesVivo:hoy,
    metaAhorro:{ anio:Number(hoy.slice(0,4)), monto:0 }, cortes:{}, gastos:[], reglas:[] };
}

/* ── Estado ───────────────────────────────────────────────────── */
let SPACE=null, DATA=null;
let TAB='mes', VIEW=null, VIEW_Q='q1', VIEW_YEAR=null;
let catSort='orden', catMode='barras', movFilterMedio='todos', movFilterCat=null;
let unsub=null, _lastPush=0, _saveT=null, _heroPrev=null;

const el=s=>document.querySelector(s);
const els=s=>[...document.querySelectorAll(s)];
const rid=()=>Math.random().toString(36).slice(2,9);
function fmtCOP(n){ n=Math.round(n||0); return (n<0?'−$':'$')+Math.abs(n).toLocaleString('es-CO'); }
function fmtShort(n){ n=Math.round(n||0); const a=Math.abs(n);
  if(a>=1e6) return (n<0?'−$':'$')+(a/1e6).toFixed(a%1e6?1:0).replace('.',',')+'M';
  if(a>=1e3) return (n<0?'−$':'$')+Math.round(a/1e3)+'k'; return (n<0?'−$':'$')+a; }
function parseNum(s){ return parseInt(String(s).replace(/[^\d]/g,''),10)||0; }
function bogotaToday(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota'}).format(new Date()); }
function mkOf(d){ return d.slice(0,7); }
function shiftMonth(mk,d){ const [y,m]=mk.split('-').map(Number); const x=new Date(y,m-1+d,1); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); }
function monthLabel(mk){ const [y,m]=mk.split('-').map(Number); const s=MESES_ES[m-1]+' '+y; return s.charAt(0).toUpperCase()+s.slice(1); }
function monthShort(mk){ const [,m]=mk.split('-').map(Number); return MESES_ES[m-1].slice(0,3); }
function daysInMonth(mk){ const [y,m]=mk.split('-').map(Number); return new Date(y,m,0).getDate(); }
function dayHeadLabel(ds){
  const t=bogotaToday(); if(ds===t) return 'Hoy';
  const y=new Date(); y.setDate(y.getDate()-1);
  if(ds===new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota'}).format(y)) return 'Ayer';
  const [Y,M,D]=ds.split('-').map(Number);
  const s=new Date(Y,M-1,D).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function fmtFecha(ds){ const [Y,M,D]=ds.split('-').map(Number); return D+' '+MESES_ES[M-1].slice(0,3); }

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── Datos / sync ─────────────────────────────────────────────── */
function lsKey(){ return 'pp_data_'+SPACE; }
function normalize(d){
  d=d||{};
  d.categorias=Array.isArray(d.categorias)?d.categorias:[];
  d.plan=d.plan&&typeof d.plan==='object'?d.plan:{};
  d.extras=d.extras&&typeof d.extras==='object'?d.extras:{};
  d.ingresos=d.ingresos&&typeof d.ingresos==='object'?d.ingresos:{nomina:0,prima:{},extra:{}};
  d.ingresos.prima=d.ingresos.prima||{}; d.ingresos.extra=d.ingresos.extra||{};
  if(typeof d.ingresos.nomina!=='number') d.ingresos.nomina=0;
  d.gastos=Array.isArray(d.gastos)?d.gastos:[];
  d.reglas=Array.isArray(d.reglas)?d.reglas:[];
  d.cortes=d.cortes&&typeof d.cortes==='object'?d.cortes:{};
  if(typeof d.saldoInicial!=='number') d.saldoInicial=0;
  d.primerMes=d.primerMes||mkOf(bogotaToday());
  d.primerMesVivo=d.primerMesVivo||d.primerMes;
  d.metaAhorro=d.metaAhorro&&typeof d.metaAhorro==='object'?d.metaAhorro:{anio:Number(mkOf(bogotaToday()).slice(0,4)),monto:0};
  d.categorias.forEach((c,i)=>{ if(!c.color) c.color=PALETTE[i%PALETTE.length]; if(!c.id) c.id='c'+rid(); });
  return d;
}
function loadData(){
  try{ const r=localStorage.getItem(lsKey()); if(r) DATA=normalize(JSON.parse(r)); }catch(e){}
  if(!DATA){ DATA=normalize(SPACE==='lauris'?seedLauris():seedYuli()); DATA._seed=true; }
  render();
  if(!USE_FB){ setSync('local'); return; }
  setSync('saving');
  const ref=db.collection('presupuestos').doc(SPACE);
  ref.get().then(snap=>{
    if(snap.exists){ DATA=normalize(snap.data()); _lastPush=DATA._savedAt||0; localStorage.setItem(lsKey(),JSON.stringify(DATA)); render(); }
    else { delete DATA._seed; pushNow(); }
    setSync('ok'); listen(ref);
  }).catch(e=>{ console.warn('get',e); setSync('err'); });
}
function listen(ref){
  if(unsub) return;
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists) return;
    const rem=snap.data();
    if((rem._savedAt||0)<=_lastPush) return;
    DATA=normalize(rem); localStorage.setItem(lsKey(),JSON.stringify(DATA)); render(); setSync('ok');
  }, e=>{ console.warn('snap',e); setSync('err'); });
}
function save(){
  DATA._savedAt=Date.now(); delete DATA._seed;
  try{ localStorage.setItem(lsKey(),JSON.stringify(DATA)); }catch(e){}
  render();
  if(!USE_FB){ setSync('local'); return; }
  setSync('saving'); clearTimeout(_saveT); _saveT=setTimeout(pushNow,500);
}
function pushNow(){
  if(!USE_FB) return;
  _lastPush=DATA._savedAt||Date.now();
  db.collection('presupuestos').doc(SPACE).set(DATA).then(()=>setSync('ok')).catch(e=>{ console.warn('push',e); setSync('err'); });
}
function setSync(s){
  const map={ ok:['ok','Sincronizado'], saving:['saving','Guardando…'], err:['err','Sin conexión'], local:['','Local'] };
  const [c,t]=map[s]||map.local; el('#sync').className='sync '+c; el('#syncTxt').textContent=t;
}
window.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&_saveT){ clearTimeout(_saveT); pushNow(); } });

/* ── Modelo financiero ───────────────────────────────────────── */
function planTotalMes(mk){
  let t=0;
  (DATA.categorias||[]).forEach(c=>{ const p=DATA.plan[c.id]; if(p&&p[mk]!=null) t+=p[mk]; });
  (DATA.extras[mk]||[]).forEach(x=> t+=x.monto||0);
  return t;
}
function ingresosMes(mk){
  const i=DATA.ingresos;
  return (i.nomina||0)+(i.prima[mk]||0)+(i.extra[mk]||[]).reduce((a,x)=>a+(x.monto||0),0);
}
function gastosDelMes(mk){ return (DATA.gastos||[]).filter(g=>g.fecha && g.fecha.slice(0,7)===mk); }
function gastoRealMes(mk){ return gastosDelMes(mk).reduce((a,g)=>a+(g.monto||0),0); }
function esMesVivo(mk){ return mk>=DATA.primerMesVivo; }

const _fzMemo={};
function mesFinanzas(mk,proy){
  const key=mk+(proy?'|p':'');
  if(_fzMemo[key]) return _fzMemo[key];
  const ing=ingresosMes(mk);
  let saldoIni;
  if(mk<=DATA.primerMes) saldoIni=DATA.saldoInicial;
  else { const prev=shiftMonth(mk,-1); saldoIni=(prev>='2015-01'&&prev<'2100-01')?mesFinanzas(prev,proy).fcl:0; }
  const totalGeneral=saldoIni+ing;
  const plan=planTotalMes(mk);
  const vivo=esMesVivo(mk);
  const curM=mkOf(bogotaToday());
  let gastado;
  if(!vivo) gastado=plan;                             // meses cerrados (Excel): ejecutado = plan
  else if(proy && mk>curM) gastado=plan;              // proyección de meses futuros
  else gastado=gastoRealMes(mk);                      // mes vivo real
  const fcl=totalGeneral-gastado;
  const r={ing,saldoIni,totalGeneral,plan,gastado,fcl,vivo,futuro:mk>curM};
  _fzMemo[key]=r; return r;
}
function computeYear(year){
  const arr=[];
  for(let m=1;m<=12;m++){
    const mk=year+'-'+String(m).padStart(2,'0');
    const real=mesFinanzas(mk,false), proy=mesFinanzas(mk,true);
    arr.push({ mk, mes:MESES_ES[m-1], ...real, fclProy:proy.fcl, gastoProy:proy.gastado });
  }
  return arr;
}

/* ── Quincenas ───────────────────────────────────────────────── */
function corteDe(mk){ return DATA.cortes[mk]||null; }
function quincenaDeGasto(g){
  const c=DATA.cortes[g.fecha.slice(0,7)];
  if(!c||!c.q1End) return 'q1';
  return g.fecha<=c.q1End ? 'q1' : 'q2';
}
function gastosQuincena(mk,q){ return gastosDelMes(mk).filter(g=>quincenaDeGasto(g)===q); }
function sumMonto(list){ return list.reduce((a,g)=>a+(g.monto||0),0); }
function sumMedio(list,medio){ return list.filter(g=>g.medio===medio).reduce((a,g)=>a+(g.monto||0),0); }

/* ── Render principal ────────────────────────────────────────── */

  if(!DATA) return;

/* ═══════════ TAB: MES ═══════════ */
function renderMes(fz,mk){
  const curM=mkOf(bogotaToday()), isCurrent=mk===curM;
  const queda=fz.plan-fz.gastado;                 // cuánto me queda para gastar
  const pctUsed=fz.plan>0?fz.gastado/fz.plan:0;
  const fillCls=pctUsed>1?'over':pctUsed>=.85?'warn':'';
  let rhythm='';
  if(isCurrent && fz.vivo && fz.plan>0){
    const dim=daysInMonth(mk), day=Number(bogotaToday().slice(8,10));
    const esperado=fz.plan*(day/dim), delta=esperado-fz.gastado;
    const cls=delta>=0?'':(Math.abs(delta)>fz.plan*0.1?'over':'warn');
    rhythm=`<div class="rhythm ${cls}">${delta>=0?'✓':'↑'}&nbsp; ${delta>=0
      ? `Vas <span class="em">${fmtCOP(Math.abs(delta))}</span> por debajo de tu ritmo · día ${day}/${dim}`
      : `Vas <span class="em">${fmtCOP(Math.abs(delta))}</span> por encima de tu ritmo · día ${day}/${dim}`}</div>`;
  } else if(!fz.vivo){
    rhythm=`<div class="rhythm">✓&nbsp; Mes cerrado (del Excel) · ejecutado <span class="em">${fmtCOP(fz.gastado)}</span></div>`;
  }
  const difOk=queda>=0;

  // quincenas
  const q1=sumMonto(gastosQuincena(mk,'q1')), q2=sumMonto(gastosQuincena(mk,'q2'));
  const c=corteDe(mk);
  const q1Label=c&&c.q1End?`1–${Number(c.q1End.slice(8,10))}`:'en curso';
  const q2Label=c&&c.q1End?`${Number(c.q1End.slice(8,10))+1}–${daysInMonth(mk)}`:'—';

  return `
  <div class="hero">
    <div class="hero-label">${fz.vivo?'●':'○'} Me queda para gastar</div>
    <div class="hero-amount num ${queda<0?'neg':''}" id="heroAmt" data-to="${Math.round(queda)}">${fmtCOP(queda)}</div>
    <div class="hero-track"><div class="hero-fill ${fillCls}" id="heroFill"></div></div>
    <div class="hero-sub">${fmtCOP(fz.gastado)} de ${fmtCOP(fz.plan)} del plan${queda<0?` · te pasaste ${fmtCOP(-queda)}`:''}</div>
    ${rhythm}
  </div>

  <div class="kpis">
    <div class="kpi"><div class="k">Presupuestado</div><div class="v num">${fmtShort(fz.plan)}</div></div>
    <div class="kpi"><div class="k">Ejecutado</div><div class="v num">${fmtShort(fz.gastado)}</div></div>
    <div class="kpi"><div class="k">Diferencia</div><div class="v num ${difOk?'ok':'over'}">${difOk?'+':'−'}${fmtShort(Math.abs(queda))}</div></div>
    <div class="kpi tap" id="kpiFcl"><div class="k">FCL del mes</div><div class="v num accent">${fmtShort(fz.fcl)}</div></div>
  </div>

  <div class="qstrip">
    <div class="qbox" data-q="q1">
      <div class="qt">Q1 <span class="st">${q1Label}</span></div>
      <div class="qv num">${fmtCOP(q1)}</div>
      <div class="qm">${gastosQuincena(mk,'q1').length} mov · Ver corte →</div>
    </div>
    <div class="qbox" data-q="q2">
      <div class="qt">Q2 <span class="st">${q2Label}</span></div>
      <div class="qv num">${fmtCOP(q2)}</div>
      <div class="qm">${gastosQuincena(mk,'q2').length} mov · Ver corte →</div>
    </div>
  </div>

  <div class="card">
    <div class="card-h">Flujo de caja libre <span class="hint">saldo + ingresos − gastos</span></div>
    <div class="fcl-flow">
      <div class="st"><span class="k">Saldo inicial</span><span class="v num">${fmtShort(fz.saldoIni)}</span></div><span class="op">+</span>
      <div class="st"><span class="k">Ingresos</span><span class="v num">${fmtShort(fz.ing)}</span></div><span class="op">−</span>
      <div class="st"><span class="k">${fz.vivo?'Gastado':'Ejecutado'}</span><span class="v num">${fmtShort(fz.gastado)}</span></div><span class="op">=</span>
      <div class="st res"><span class="k">FCL</span><span class="v num ${fz.fcl<0?'neg':''}">${fmtShort(fz.fcl)}</span></div>
    </div>
    <div class="fcl3">
      ${[shiftMonth(mk,-2),shiftMonth(mk,-1),mk].map(k=>{
        const v=mesFinanzas(k);
        const mx=Math.max(1,...[shiftMonth(mk,-2),shiftMonth(mk,-1),mk].map(z=>mesFinanzas(z).gastado));
        const h=Math.max(3,Math.round(v.gastado/mx*28));
        return `<div class="col ${k===mk?'active':''}" data-month="${k}">

function renderValida(fz,mk){

function catRows(mk,vivo){
  return (DATA.categorias||[]).map(c=>{

    return { c, plan, real, n:gs.length, pct, dif:plan-real };
  });

  <div class="pr-foot">

    <div class="pf"><span class="k">Diferencia</span><span class="v num ${okd?'ok':'over'}">${okd?'+':'−'}${fmtCOP(Math.abs(totPlan-totReal))}</span></div>
  </div>`;
}

function renderMovimientos(mk, srcList, scopeLabel){
  let list=srcList.slice();
  const nTot=list.length;
  if(movFilterMedio!=='todos') list=list.filter(g=>g.medio===movFilterMedio);
  if(movFilterCat) list=list.filter(g=>g.categoriaId===movFilterCat);
  list.sort((a,b)=> b.fecha===a.fecha ? (b.creadoEn||0)-(a.creadoEn||0) : (b.fecha<a.fecha?-1:1));
  const filtCat=movFilterCat?catById(movFilterCat):null;
  let body;
  if(!list.length){
    body=`<div class="mov-empty">${nTot?'Sin movimientos con este filtro.':'Sin movimientos '+scopeLabel+'.<br>Toca <b>+ Gasto</b> para agregar el primero.'}</div>`;
  } else {
    const g={}; list.forEach(x=>{ (g[x.fecha]=g[x.fecha]||[]).push(x); });
    body=Object.keys(g).sort().reverse().map(ds=>{
      const it=g[ds], tot=sumMonto(it);
      return `<div class="day-group"><div class="day-head"><span>${dayHeadLabel(ds)}</span><span class="day-total num">${fmtCOP(tot)}</span></div>
      ${it.map(x=>{
        const c=catById(x.categoriaId); const mc=x.medio==='TC'?'tc':x.medio==='TD'?'td':'efvo';
        return `<div class="mov" data-gasto="${x.id}"><div class="mov-emoji">${c?c.emoji:'•'}</div>
          <div class="mov-body"><div class="mov-title">${escapeHtml(x.comercio||'(sin comercio)')}</div>
          <div class="mov-sub"><span>${c?escapeHtml(c.nombre):'Sin categoría'}</span><span class="medio-chip ${mc}">${x.medio||'—'}</span>${x.nota?`<span>· ${escapeHtml(x.nota)}</span>`:''}</div></div>
          <div class="mov-amount num">${fmtCOP(x.monto)}</div></div>`;
      }).join('')}</div>`;
    }).join('');
  }
  return `<div id="movimientos">
    <div class="section-head"><h3 class="section-h">Movimientos${nTot?' · '+nTot:''}</h3></div>
    <div class="filterbar">${['todos','TC','TD','Efectivo'].map(f=>`<button class="chip ${movFilterMedio===f?'on':''}" data-medio="${f}">${f==='todos'?'Todos':f}</button>`).join('')}
      ${filtCat?`<span class="filter-active">${filtCat.emoji} ${escapeHtml(filtCat.nombre)} <button id="clrCat">✕</button></span>`:''}</div>
    ${body}</div>`;
}

/* ═══════════ TAB: QUINCENA / CORTE ═══════════ */
function renderQuincena(){
  const mk=VIEW, c=corteDe(mk);
  const q=VIEW_Q;
  const gs=gastosQuincena(mk,q);
  const total=sumMonto(gs);
  const tc=sumMedio(gs,'TC'), td=sumMedio(gs,'TD'), efvo=sumMedio(gs,'Efectivo');
  const mx=Math.max(1,tc,td,efvo);
  const corteQ=(c&&c[q])||{};
  const q1Closed=!!(c&&c.q1End);

  // rango de fechas
  let rango;
  if(q==='q1') rango=q1Closed?`1 – ${Number(c.q1End.slice(8,10))} ${monthShort(mk)}`:`desde el 1 · en curso`;
  else rango=q1Closed?`${Number(c.q1End.slice(8,10))+1} – ${daysInMonth(mk)} ${monthShort(mk)}`:`aún no arranca (cierra Q1 primero)`;

  // estado de corte
  let stateHTML='';
  if(q==='q1'){
    stateHTML = q1Closed
      ? `<div class="corte-state">✓ Q1 cerrada el ${fmtFecha(c.q1End)} · TC pagado ${fmtCOP(corteQ.tcPagado||0)}<button class="chip" id="reCorte">Editar</button></div>`
      : `<div class="corte-state pend">◔ Q1 en curso — cuando hagas el corte, ciérrala<button class="chip" id="doCorte">Cerrar Q1</button></div>`;
  } else {
    if(!q1Closed) stateHTML=`<div class="corte-state pend">Primero cierra la Q1 para separar la Q2</div>`;
    else stateHTML = corteQ.cerrado
      ? `<div class="corte-state">✓ Mes cerrado el ${fmtFecha(corteQ.fecha)} · TC pagado ${fmtCOP(corteQ.tcPagado||0)}<button class="chip" id="reCorte">Editar</button></div>`
      : `<div class="corte-state pend">◔ Q2 en curso — al final del mes, haz el corte<button class="chip" id="doCorte">Cerrar mes</button></div>`;
  }

  // por categoría en la quincena
  const byCat={};
  gs.forEach(g=>{ byCat[g.categoriaId]=(byCat[g.categoriaId]||0)+(g.monto||0); });
  const catLines=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cid,v])=>{
    const cat=catById(cid); const w=Math.round(v/(total||1)*100);
    return `<div class="mini-cat"><span class="e">${cat?cat.emoji:'•'}</span>
      <span class="nm">${cat?escapeHtml(cat.nombre):'Sin categoría'}</span>
      <span class="tk"><i style="width:${w}%;background:${cat?cat.color:'var(--ink-3)'}"></i></span>
      <span class="amt num">${fmtCOP(v)}</span></div>`;
  }).join('') || '<div style="color:var(--ink-3);font-size:.82rem;padding:6px 0">Sin gastos en esta quincena.</div>';

  // comparativo
  let prev, prevLabel;
  if(q==='q2'){ prev=sumMonto(gastosQuincena(mk,'q1')); prevLabel='Q1 de este mes'; }
  else { prev=sumMonto(gastosQuincena(shiftMonth(mk,-1),'q2')); prevLabel='Q2 del mes pasado'; }
  const dcmp=total-prev;

  return `
  <div class="qseg">
    <button class="${q==='q1'?'on':''}" data-q="q1">Q1<span class="sub">${q1Closed?'1–'+Number(c.q1End.slice(8,10)):'en curso'}</span></button>
    <button class="${q==='q2'?'on':''}" data-q="q2">Q2<span class="sub">${q1Closed?(Number(c.q1End.slice(8,10))+1)+'–'+daysInMonth(mk):'—'}</span></button>
  </div>

  ${stateHTML}

  <div class="hero" style="padding:15px 18px">
    <div class="hero-label">● Gastado en ${q.toUpperCase()}</div>
    <div class="hero-amount num" style="font-size:clamp(1.9rem,8vw,2.6rem)">${fmtCOP(total)}</div>
    <div class="hero-sub">${rango} · ${gs.length} movimiento${gs.length===1?'':'s'}</div>
  </div>

  <div class="card tc-pay">
    <div class="card-h" style="color:var(--tc)">A pagar de la tarjeta (TC)</div>
    <div class="big num">${fmtCOP(tc)}</div>
    <div class="hero-sub">Suma de todo lo pagado con TC en esta quincena.${corteQ.tcPagado?` Ya registraste un pago de <b>${fmtCOP(corteQ.tcPagado)}</b>.`:''}</div>
  </div>

  <div class="card">
    <div class="card-h">Por medio de pago</div>
    <div class="medio-split">
      <div class="ms tc"><div class="k">TC</div><div class="v num">${fmtShort(tc)}</div><div class="bar"><i style="width:${Math.round(tc/mx*100)}%"></i></div></div>
      <div class="ms td"><div class="k">TD</div><div class="v num">${fmtShort(td)}</div><div class="bar"><i style="width:${Math.round(td/mx*100)}%"></i></div></div>
      <div class="ms efvo"><div class="k">EFVO</div><div class="v num">${fmtShort(efvo)}</div><div class="bar"><i style="width:${Math.round(efvo/mx*100)}%"></i></div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-h">Por categoría <span class="hint">${prevLabel}: ${fmtShort(prev)} · ${dcmp>=0?'+':'−'}${fmtShort(Math.abs(dcmp))}</span></div>
    <div class="mini-cats">${catLines}</div>
  </div>

  ${renderMovimientos(mk, gs, 'en esta quincena')}
  `;
}
function wireQuincena(){
  els('.qseg button').forEach(b=> b.onclick=()=>{ VIEW_Q=b.dataset.q; render(); });
  const dc=el('#doCorte'); if(dc) dc.onclick=()=>openCorte(VIEW_Q);
  const rc=el('#reCorte'); if(rc) rc.onclick=()=>openCorte(VIEW_Q);
  wireMovShared();
}
function openCorte(q){
  const mk=VIEW, c=DATA.cortes[mk]||{};
  const gs=gastosQuincena(mk,q);
  const tcSug=sumMedio(gs,'TC');
  const prev=(c&&c[q])||{};
  const esQ1=q==='q1';
  const draft={
    fecha: prev.fecha || (esQ1 && c.q1End ? c.q1End : bogotaToday()),
    tcPagado: prev.tcPagado!=null ? prev.tcPagado : tcSug,
    nota: prev.nota||'',
  };
  openSheet(`
    <h2>${esQ1?'Cerrar Q1':'Cerrar el mes'} · ${monthLabel(mk)}</h2>
    <div class="sheet-sub">${esQ1
      ? 'Marca hasta qué día llega la primera quincena. Los gastos hasta esa fecha quedan en Q1; los siguientes, en Q2.'
      : 'Cierre de la segunda quincena y del mes.'}</div>
    <div class="field"><label>${esQ1?'Último día de la Q1':'Fecha del corte'}</label>
      <input class="input" type="date" id="coFecha" value="${draft.fecha}" min="${mk}-01" max="${bogotaToday()}"></div>
    <div class="field"><label>Pago a la tarjeta (TC) en este corte</label>
      <input class="input num" id="coTC" inputmode="numeric" value="${draft.tcPagado?fmtCOP(draft.tcPagado):''}" placeholder="$0">
      <div class="ce-scope">Gastado con TC en ${q.toUpperCase()}: <b>${fmtCOP(tcSug)}</b></div></div>
    <div class="field"><label>Nota (opcional)</label>
      <input class="input" id="coNota" value="${escapeAttr(draft.nota)}" placeholder="Ej: quedó saldo pendiente en Rappi" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="coSave">${esQ1?'Cerrar Q1':'Cerrar mes'}</button>
    ${(prev.cerrado||(esQ1&&c.q1End))?'<button class="btn btn-danger btn-block" id="coReopen" style="margin-top:9px">Reabrir</button>':''}
  `);
  const tcI=el('#coTC'); tcI.oninput=e=>{ const n=parseNum(e.target.value); draft.tcPagado=n; e.target.value=n?fmtCOP(n):''; };
  el('#coFecha').onchange=e=>draft.fecha=e.target.value;
  el('#coNota').oninput=e=>draft.nota=e.target.value;
  el('#coSave').onclick=()=>{
    const cc=DATA.cortes[mk]||{};
    if(esQ1){ cc.q1End=draft.fecha; cc.q1={cerrado:true,fecha:draft.fecha,tcPagado:draft.tcPagado,nota:draft.nota.trim()}; }
    else { cc.q2={cerrado:true,fecha:draft.fecha,tcPagado:draft.tcPagado,nota:draft.nota.trim()}; }
    DATA.cortes[mk]=cc; save(); closeSheet(); toast(esQ1?'Q1 cerrada ✓':'Mes cerrado ✓');
  };
  const ro=el('#coReopen'); if(ro) ro.onclick=()=>{
    const cc=DATA.cortes[mk]||{};
    if(esQ1){ delete cc.q1End; delete cc.q1; delete cc.q2; }
    else { delete cc.q2; }
    DATA.cortes[mk]=cc; save(); closeSheet(); toast('Corte reabierto');
  };
}

/* ── Charts SVG ──────────────────────────────────────────────── */
function chartFCL(yr, meta, curIdx){
  const W=680,H=210, pl=6,pr=6,pt=14,pb=24;
  const vals=yr.map(m=>m.fclProy);
  const lo=Math.min(0,meta,...vals), hi=Math.max(meta,...vals,1);
  const span=hi-lo||1;
  const X=i=> pl + i*(W-pl-pr)/11;
  const Y=v=> pt + (1-(v-lo)/span)*(H-pt-pb);
  const ptsReal=[], ptsProy=[];
  yr.forEach((m,i)=>{ const p=[X(i),Y(m.fclProy)]; if(curIdx<0||i<=curIdx) ptsReal.push(p); if(curIdx>=0&&i>=curIdx) ptsProy.push(p); });
  const line=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaReal = ptsReal.length? line(ptsReal)+` L ${ptsReal[ptsReal.length-1][0].toFixed(1)} ${Y(lo).toFixed(1)} L ${ptsReal[0][0].toFixed(1)} ${Y(lo).toFixed(1)} Z` : '';
  const yMeta=Y(meta);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="FCL por mes">
    <defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${meta>0?`<line x1="${pl}" y1="${yMeta.toFixed(1)}" x2="${W-pr}" y2="${yMeta.toFixed(1)}" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 4"/>`:''}
    ${areaReal?`<path d="${areaReal}" fill="url(#gf)"/>`:''}
    ${ptsReal.length>1?`<path d="${line(ptsReal)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${ptsProy.length>1?`<path d="${line(ptsProy)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 5" opacity=".45" stroke-linecap="round"/>`:''}
    ${yr.map((m,i)=>{ const isCur=i===curIdx; return `<circle cx="${X(i).toFixed(1)}" cy="${Y(m.fclProy).toFixed(1)}" r="${isCur?4:2.5}" fill="${isCur?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`; }).join('')}
    ${yr.map((m,i)=> i%2===0?`<text x="${X(i).toFixed(1)}" y="${H-7}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${m.mes.slice(0,3)}</text>`:'').join('')}
  </svg>`;
}
function chartBars(yr, curIdx){
  const W=680,H=200, pl=6,pr=6,pt=12,pb=22;
  const max=Math.max(1,...yr.map(m=>Math.max(m.plan,m.gastoProy)));
  const gw=(W-pl-pr)/12;
  const Y=v=> pt+(1-v/max)*(H-pt-pb);
  const base=H-pb;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Presupuestado vs ejecutado por mes">
    ${yr.map((m,i)=>{
      const cx=pl+i*gw, bw=gw*0.32;
      const yP=Y(m.plan), yE=Y(m.gastoProy);
      const future=m.futuro;
      return `<rect x="${(cx+gw*0.14).toFixed(1)}" y="${yP.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-yP).toFixed(1)}" rx="2" fill="var(--line-2)"/>
      <rect x="${(cx+gw*0.5).toFixed(1)}" y="${yE.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-yE).toFixed(1)}" rx="2" fill="var(--accent)" opacity="${future?0.4:1}"/>
      <text x="${(cx+gw*0.42).toFixed(1)}" y="${H-6}" font-size="10" fill="var(--ink-3)" text-anchor="middle">${m.mes.slice(0,1).toUpperCase()}</text>`;
    }).join('')}
  </svg>`;
}

/* ── Animación número ────────────────────────────────────────── */
function animateNumber(node){
  if(!node) return;
  const to=Number(node.dataset.to)||0, t0=performance.now(), dur=520;
  function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3), v=Math.round(to*e);
    node.textContent=(v<0?'−$':'$')+Math.abs(v).toLocaleString('es-CO');
    node.classList.toggle('neg',v<0);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function closeSheet(){ el('#overlay').classList.remove('open'); }

/* ── Gasto ──────────────────────────────────────────────────── */
let expDraft=null;
function openExpense(id){
  const editing=!!id;
  const g=editing?(DATA.gastos||[]).find(x=>x.id===id):null;
  if(editing&&!g) return;
  expDraft = editing ? {...g}
    : { id:rid(), fecha:bogotaToday(), monto:0, comercio:'', medio:'TC', categoriaId:(DATA.categorias[0]||{}).id||null, nota:'', creadoEn:Date.now() };
  const cats=DATA.categorias||[];
  openSheet(`
    <h2>${editing?'Editar gasto':'Nuevo gasto'}</h2>
    <div class="sheet-sub">${editing?'Ajusta lo que necesites':'Se guarda al instante'}</div>
    <div class="field"><label>Monto</label><input class="input input-amount num" id="fMonto" inputmode="numeric" placeholder="$0" value="${expDraft.monto?fmtCOP(expDraft.monto):''}"></div>
    <div class="field"><label>Comercio</label><input class="input" id="fComercio" placeholder="Ej: D1, Terpel, Netflix…" value="${escapeAttr(expDraft.comercio)}" autocomplete="off"></div>
    <div class="field"><label>Medio de pago</label><div class="seg" id="fMedio">${['TC','TD','Efectivo'].map(x=>`<button data-v="${x}" class="${expDraft.medio===x?'on':''}">${x}</button>`).join('')}</div></div>
    <div class="field"><label>Fecha</label><input class="input" type="date" id="fFecha" value="${expDraft.fecha}" max="${bogotaToday()}"></div>
    <div class="field"><label>Categoría</label><div class="cat-picker" id="fCat">${cats.map(c=>`<button class="cat-opt ${expDraft.categoriaId===c.id?'on':''}" data-v="${c.id}">${c.emoji} ${escapeHtml(c.nombre)}</button>`).join('')||'<span style="font-size:.82rem;color:var(--ink-3)">Crea una categoría primero (⋯ → Categorías)</span>'}</div></div>
    <div class="field"><label>Nota (opcional)</label><input class="input" id="fNota" placeholder="Un detalle para recordar" value="${escapeAttr(expDraft.nota||'')}" autocomplete="off"></div>
    <button class="btn btn-primary btn-block" id="fSave">${editing?'Guardar cambios':'Agregar gasto'}</button>
    ${editing?'<button class="btn btn-danger btn-block" id="fDel" style="margin-top:9px">Eliminar gasto</button>':''}
  `);
  const mi=el('#fMonto');
  mi.addEventListener('input',()=>{ const n=parseNum(mi.value); expDraft.monto=n; mi.value=n?fmtCOP(n):''; });
  el('#fComercio').addEventListener('input',e=>expDraft.comercio=e.target.value);
  el('#fNota').addEventListener('input',e=>expDraft.nota=e.target.value);
  el('#fFecha').addEventListener('change',e=>expDraft.fecha=e.target.value);
  els('#fMedio button').forEach(b=> b.onclick=()=>{ expDraft.medio=b.dataset.v; els('#fMedio button').forEach(x=>x.classList.toggle('on',x===b)); });
  els('#fCat .cat-opt').forEach(b=> b.onclick=()=>{ expDraft.categoriaId=b.dataset.v; els('#fCat .cat-opt').forEach(x=>x.classList.toggle('on',x===b)); });
  el('#fSave').onclick=()=>saveExpense(editing);
  if(editing) el('#fDel').onclick=()=>deleteExpense(id);
  if(!editing) setTimeout(()=>mi.focus(),320);
}
function saveExpense(editing){
  if(!expDraft.monto){ toast('Escribe el monto'); el('#fMonto').focus(); return; }
  if(!expDraft.categoriaId){ toast('Elige una categoría'); return; }
  expDraft.comercio=(expDraft.comercio||'').trim();
  if(editing){ const i=DATA.gastos.findIndex(x=>x.id===expDraft.id); if(i>=0) DATA.gastos[i]={...expDraft}; }
  else { DATA.gastos.push({...expDraft,origen:'manual'}); if(TAB!=='anio'){ VIEW=mkOf(expDraft.fecha); VIEW_YEAR=Number(VIEW.slice(0,4)); } }
  save(); closeSheet(); toast(editing?'Gasto actualizado':'Gasto agregado ✓');
}
function deleteExpense(id){
  confirmSheet('¿Eliminar este gasto?','No se puede deshacer.','Eliminar',()=>{ DATA.gastos=DATA.gastos.filter(x=>x.id!==id); save(); closeSheet(); toast('Gasto eliminado'); });
}

/* ── Categorías ─────────────────────────────────────────────── */
let catDraft=null;
function openCategorias(focusNew){
  catDraft=(DATA.categorias||[]).map(c=>({ ...c, _base:(DATA.plan[c.id]&&DATA.plan[c.id][VIEW])||0 }));
  renderCatEditor(); if(focusNew) addCatRow();
}
function renderCatEditor(){
  const total=catDraft.reduce((a,c)=>a+(c._base||0),0);
  openSheet(`
    <h2>Categorías</h2>
    <div class="sheet-sub">Nombre, ícono y presupuesto. El presupuesto aplica a <b>${monthLabel(VIEW)}</b> en adelante.</div>
    <div id="ceList">${catDraft.map((c,i)=>`
      <div class="ce-row" data-i="${i}">
        <button class="ce-emoji" data-emoji="${i}">${c.emoji||'•'}</button>
        <input class="ce-name" data-name="${i}" value="${escapeAttr(c.nombre)}" placeholder="Nombre" autocomplete="off">
        <input class="ce-budget num" data-budget="${i}" value="${c._base?fmtCOP(c._base):''}" placeholder="$0" inputmode="numeric">
        <button class="ce-del" data-del="${i}" aria-label="Eliminar">🗑</button>
      </div>`).join('')}</div>
    <button class="ce-add" id="ceAdd">+ Agregar categoría</button>
    <div class="ce-total"><span>Presupuesto base total</span><span class="num">${fmtCOP(total)}</span></div>
    <div class="btn-row" style="margin-top:16px"><button class="btn btn-ghost" id="ceCancel">Cancelar</button><button class="btn btn-primary" id="ceSave">Guardar</button></div>
  `);
  els('#ceList .ce-name').forEach(x=> x.oninput=e=>catDraft[+e.target.dataset.name].nombre=e.target.value);
  els('#ceList .ce-budget').forEach(x=> x.oninput=e=>{ const n=parseNum(e.target.value); catDraft[+e.target.dataset.budget]._base=n; e.target.value=n?fmtCOP(n):''; });
  els('#ceList .ce-del').forEach(b=> b.onclick=()=>{
    const i=+b.dataset.del, c=catDraft[i];
    const used=(DATA.gastos||[]).some(g=>g.categoriaId===c.id);
    if(used) confirmSheet(`Eliminar "${c.nombre}"`,'Tiene gastos asociados; quedarán sin categoría.','Eliminar',()=>{ catDraft.splice(i,1); renderCatEditor(); });
    else { catDraft.splice(i,1); renderCatEditor(); }
  });
  els('#ceList .ce-emoji').forEach(b=> b.onclick=()=>pickEmoji(+b.dataset.emoji));
  el('#ceAdd').onclick=addCatRow; el('#ceCancel').onclick=closeSheet; el('#ceSave').onclick=saveCats;
}
function addCatRow(){
  catDraft.push({ id:'c'+rid(), nombre:'', emoji:'🏷️', color:PALETTE[catDraft.length%PALETTE.length], _base:0 });
  renderCatEditor();
  const l=el('#ceList').lastElementChild; if(l){ l.scrollIntoView({block:'center'}); l.querySelector('.ce-name').focus(); }
}
function saveCats(){
  const clean=catDraft.map(c=>({...c,nombre:(c.nombre||'').trim()})).filter(c=>c.nombre);
  if(!clean.length){ toast('Deja al menos una categoría'); return; }
  const meses=[]; for(let m=0;m<24;m++) meses.push(shiftMonth(VIEW,m));
  const newCats=[], newPlan={};
  clean.forEach(c=>{
    newCats.push({ id:c.id, nombre:c.nombre, emoji:c.emoji||'🏷️', color:c.color||PALETTE[newCats.length%PALETTE.length] });
    newPlan[c.id]=DATA.plan[c.id]?{...DATA.plan[c.id]}:{};
    meses.forEach(mk=>{ if(c._base>0) newPlan[c.id][mk]=c._base; });
  });
  DATA.categorias=newCats; DATA.plan=newPlan;
  save(); closeSheet(); toast('Categorías guardadas ✓');
}
function useTemplate(){
  const s=seedLauris(); DATA.categorias=s.categorias; DATA.plan=s.plan; DATA.extras=s.extras;
  save(); toast('Plantilla cargada · edítala a tu gusto');
}
function pickEmoji(idx){
  const cur=catDraft[idx].emoji;
  openSheet(`
    <h2>Elige un ícono</h2><div class="sheet-sub">Para "${escapeHtml(catDraft[idx].nombre||'nueva categoría')}"</div>
    <div class="emoji-grid" id="egrid">${EMOJIS.map(e=>`<button class="${e===cur?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>
    <input class="input" id="eCustom" placeholder="…o pega otro emoji" maxlength="4">
    <div class="btn-row" style="margin-top:12px"><button class="btn btn-ghost" id="eBack">Volver</button><button class="btn btn-primary" id="eOk">Usar</button></div>
  `);
  let sel=cur;
  els('#egrid button').forEach(b=> b.onclick=()=>{ sel=b.dataset.e; els('#egrid button').forEach(x=>x.classList.toggle('on',x===b)); el('#eCustom').value=''; });
  el('#eCustom').oninput=e=>{ if(e.target.value.trim()) sel=e.target.value.trim(); };
  el('#eBack').onclick=renderCatEditor;
  el('#eOk').onclick=()=>{ catDraft[idx].emoji=sel||'🏷️'; renderCatEditor(); };
}

/* ── Plan del mes ───────────────────────────────────────────── */
let planDraft=null;
function openPlan(){
  const mk=VIEW;
  planDraft={
    cats:(DATA.categorias||[]).map(c=>({ id:c.id, nombre:c.nombre, emoji:c.emoji, monto:(DATA.plan[c.id]&&DATA.plan[c.id][mk])||0 })),
    extras:JSON.parse(JSON.stringify(DATA.extras[mk]||[])),
  };
  renderPlan();
}
function renderPlan(){
  const mk=VIEW;
  const totC=planDraft.cats.reduce((a,c)=>a+(c.monto||0),0);
  const totX=planDraft.extras.reduce((a,x)=>a+(x.monto||0),0);
  openSheet(`
    <h2>Plan de ${monthLabel(mk)}</h2>
    <div class="sheet-sub">Cuánto piensas gastar este mes por categoría, más compras puntuales grandes (extras).</div>
    <div id="plList">${planDraft.cats.map((c,i)=>`
      <div class="ce-row" data-i="${i}">
        <div class="ce-emoji">${c.emoji||'•'}</div>
        <div style="flex:1;min-width:0;padding-left:2px">${escapeHtml(c.nombre)}</div>
        <input class="ce-budget num" data-pl="${i}" value="${c.monto?fmtCOP(c.monto):''}" placeholder="$0" inputmode="numeric">
      </div>`).join('')}</div>
    <div class="ce-scope" style="margin-top:14px;font-weight:600;color:var(--ink-2)">Compras puntuales (extras)</div>
    <div id="xList">${planDraft.extras.map((x,i)=>`
      <div class="ce-row" data-xi="${i}">
        <input class="ce-name" data-xn="${i}" value="${escapeAttr(x.nombre)}" placeholder="Concepto" autocomplete="off">
        <input class="ce-budget num" data-xm="${i}" value="${x.monto?fmtCOP(x.monto):''}" placeholder="$0" inputmode="numeric">
        <button class="ce-del" data-xd="${i}">🗑</button>
      </div>`).join('') || '<div style="color:var(--ink-3);font-size:.82rem;padding:6px 0">Sin extras.</div>'}</div>
    <button class="ce-add" id="xAdd">+ Agregar extra</button>
    <div class="ce-total"><span>Plan total del mes</span><span class="num">${fmtCOP(totC+totX)}</span></div>
    <div class="btn-row" style="margin-top:16px"><button class="btn btn-ghost" id="plCancel">Cancelar</button><button class="btn btn-primary" id="plSave">Guardar</button></div>
  `);
  els('#plList [data-pl]').forEach(inp=> inp.oninput=e=>{ const n=parseNum(e.target.value); planDraft.cats[+e.target.dataset.pl].monto=n; e.target.value=n?fmtCOP(n):''; });
  els('#xList [data-xn]').forEach(inp=> inp.oninput=e=>planDraft.extras[+e.target.dataset.xn].nombre=e.target.value);
  els('#xList [data-xm]').forEach(inp=> inp.oninput=e=>{ const n=parseNum(e.target.value); planDraft.extras[+e.target.dataset.xm].monto=n; e.target.value=n?fmtCOP(n):''; });
  els('#xList [data-xd]').forEach(b=> b.onclick=()=>{ planDraft.extras.splice(+b.dataset.xd,1); renderPlan(); });
  el('#xAdd').onclick=()=>{ planDraft.extras.push({id:rid(),nombre:'',monto:0}); renderPlan(); };
  el('#plCancel').onclick=closeSheet;
  el('#plSave').onclick=()=>{
    const mk=VIEW;
    planDraft.cats.forEach(c=>{ DATA.plan[c.id]=DATA.plan[c.id]||{}; if(c.monto>0) DATA.plan[c.id][mk]=c.monto; else delete DATA.plan[c.id][mk]; });
    const xs=planDraft.extras.map(x=>({...x,nombre:(x.nombre||'').trim()})).filter(x=>x.nombre&&x.monto);
    if(xs.length) DATA.extras[mk]=xs; else delete DATA.extras[mk];
    save(); closeSheet(); toast('Plan guardado ✓');
  };
}

/* ── Ingresos + saldo inicial ──────────────────────────────── */
let ingDraft=null;
function openIngresos(){
  const mk=VIEW;
  ingDraft={
    nomina:DATA.ingresos.nomina||0, prima:DATA.ingresos.prima[mk]||0,
    extra:JSON.parse(JSON.stringify(DATA.ingresos.extra[mk]||[])),
    saldo:DATA.saldoInicial||0, esPrimerMes:mk<=DATA.primerMes,
  };
  renderIngresos();
}
function renderIngresos(){
  const mk=VIEW, fz=mesFinanzas(mk);
  const tot=(ingDraft.nomina||0)+(ingDraft.prima||0)+ingDraft.extra.reduce((a,x)=>a+(x.monto||0),0);
  openSheet(`
    <h2>Ingresos de ${monthLabel(mk)}</h2>
    <div class="sheet-sub">Se usan para calcular el flujo de caja libre (FCL).</div>
    <div class="field"><label>Nómina del mes (todas las quincenas)</label>
      <input class="input num" id="iNom" inputmode="numeric" value="${ingDraft.nomina?fmtCOP(ingDraft.nomina):''}" placeholder="$0">
      <div class="ce-scope">Aplica a todos los meses. En el Excel: 2 × $3.220.000.</div></div>
    <div class="field"><label>Prima / bono de este mes</label>
      <input class="input num" id="iPri" inputmode="numeric" value="${ingDraft.prima?fmtCOP(ingDraft.prima):''}" placeholder="$0">
      <div class="ce-scope">Solo para ${monthLabel(mk)}. En el Excel: junio y diciembre.</div></div>
    <div class="ce-scope" style="font-weight:600;color:var(--ink-2)">Otros ingresos de este mes</div>
    <div id="ieList">${ingDraft.extra.map((x,i)=>`
      <div class="ce-row" data-i="${i}">
        <input class="ce-name" data-ien="${i}" value="${escapeAttr(x.nombre)}" placeholder="Concepto" autocomplete="off">
        <input class="ce-budget num" data-iem="${i}" value="${x.monto?fmtCOP(x.monto):''}" placeholder="$0" inputmode="numeric">
        <button class="ce-del" data-ied="${i}">🗑</button>
      </div>`).join('') || '<div style="color:var(--ink-3);font-size:.82rem;padding:6px 0">Ninguno.</div>'}</div>
    <button class="ce-add" id="ieAdd">+ Agregar ingreso</button>
    ${ingDraft.esPrimerMes?`
      <div class="field" style="margin-top:16px"><label>Saldo inicial (antes de ${monthLabel(mk)})</label>
        <input class="input num" id="iSaldo" inputmode="numeric" value="${ingDraft.saldo?fmtCOP(ingDraft.saldo):'$0'}">
        <div class="ce-scope">Punto de partida del FCL. En el Excel arranca en $0 en enero.</div></div>`
      :`<div class="ce-scope" style="margin-top:14px">Saldo inicial de este mes: <b class="num">${fmtCOP(fz.saldoIni)}</b> (viene del FCL de ${monthLabel(shiftMonth(mk,-1))}).</div>`}
    <div class="ce-total"><span>Total ingresos del mes</span><span class="num">${fmtCOP(tot)}</span></div>
    <div class="btn-row" style="margin-top:16px"><button class="btn btn-ghost" id="ieCancel">Cancelar</button><button class="btn btn-primary" id="ieSave">Guardar</button></div>
  `);
  el('#iNom').oninput=e=>{ const n=parseNum(e.target.value); ingDraft.nomina=n; e.target.value=n?fmtCOP(n):''; };
  el('#iPri').oninput=e=>{ const n=parseNum(e.target.value); ingDraft.prima=n; e.target.value=n?fmtCOP(n):''; };
  els('#ieList [data-ien]').forEach(x=> x.oninput=e=>ingDraft.extra[+e.target.dataset.ien].nombre=e.target.value);
  els('#ieList [data-iem]').forEach(x=> x.oninput=e=>{ const n=parseNum(e.target.value); ingDraft.extra[+e.target.dataset.iem].monto=n; e.target.value=n?fmtCOP(n):''; });
  els('#ieList [data-ied]').forEach(b=> b.onclick=()=>{ ingDraft.extra.splice(+b.dataset.ied,1); renderIngresos(); });
  el('#ieAdd').onclick=()=>{ ingDraft.extra.push({id:rid(),nombre:'',monto:0}); renderIngresos(); };
  const sa=el('#iSaldo'); if(sa) sa.oninput=e=>{ const n=parseNum(e.target.value); ingDraft.saldo=n; e.target.value=n?fmtCOP(n):''; };
  el('#ieCancel').onclick=closeSheet;
  el('#ieSave').onclick=()=>{
    const mk=VIEW;
    DATA.ingresos.nomina=ingDraft.nomina;
    if(ingDraft.prima>0) DATA.ingresos.prima[mk]=ingDraft.prima; else delete DATA.ingresos.prima[mk];
    const xs=ingDraft.extra.map(x=>({...x,nombre:(x.nombre||'').trim()})).filter(x=>x.nombre&&x.monto);
    if(xs.length) DATA.ingresos.extra[mk]=xs; else delete DATA.ingresos.extra[mk];
    if(ingDraft.esPrimerMes) DATA.saldoInicial=ingDraft.saldo;
    save(); closeSheet(); toast('Ingresos guardados ✓');
  };
}

/* ── Meta de ahorro ────────────────────────────────────────── */
function openMeta(){
  const m=DATA.metaAhorro;
  openSheet(`
    <h2>Meta de ahorro del año</h2>
    <div class="sheet-sub">El FCL que quieres tener al cerrar diciembre. El módulo Año mide el avance contra esta meta.</div>
    <div class="field"><label>Año</label><input class="input num" id="maAnio" inputmode="numeric" value="${m.anio||VIEW_YEAR}"></div>
    <div class="field"><label>Meta de FCL a diciembre</label><input class="input num" id="maMonto" inputmode="numeric" value="${m.monto?fmtCOP(m.monto):''}" placeholder="$0">
      <div class="ce-scope">En tu Excel, el FCL de diciembre 2026 llega a $13.494.000.</div></div>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" id="maCancel">Cancelar</button><button class="btn btn-primary" id="maSave">Guardar</button></div>
  `);
  el('#maMonto').oninput=e=>{ const n=parseNum(e.target.value); e.target.value=n?fmtCOP(n):''; };
  el('#maCancel').onclick=closeSheet;
  el('#maSave').onclick=()=>{
    DATA.metaAhorro={ anio:parseNum(el('#maAnio').value)||VIEW_YEAR, monto:parseNum(el('#maMonto').value) };
    save(); closeSheet(); toast('Meta guardada ✓');
  };
}

/* ── Confirm ───────────────────────────────────────────────── */
function confirmSheet(title,sub,okLabel,onOk){
  openSheet(`<h2>${escapeHtml(title)}</h2><div class="sheet-sub">${escapeHtml(sub||'')}</div>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-ghost" id="cfNo">Cancelar</button><button class="btn btn-danger" id="cfYes">${escapeHtml(okLabel||'Aceptar')}</button></div>`);
  el('#cfNo').onclick=closeSheet; el('#cfYes').onclick=onOk;
}
</script>
</body>
</html>
